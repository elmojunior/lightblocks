# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Compile desktop, android and gwt

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17 (for Android SDK tools)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Android build environment
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-29 build-tools;29.0.3'
    - name: Set up JDK 1.8 (for project build)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build desktop
      run: ./gradlew desktop:build
    - name: Build server
      run: ./gradlew server:build

    - name: Build Android
      run: ./gradlew android:assembleGenericDebug --stacktrace --console=plain
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: lightblocks-generic-debug-apk
        path: "android/build/outputs/apk/**/*.apk"
    - name: Build HTML
      run: ./gradlew html:compileGwt
